name: wdym

services:
  wdym-dev:
    build: .
    container_name: wdym-dev
    command: sleep infinity
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspace:z
      - uv_data:/root/.local/share/uv
      - uv_cache:/root/.cache/uv
    working_dir: /workspace

volumes:
  uv_data:
  uv_cache:
