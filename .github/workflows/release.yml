name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(wdym VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$version" || { echo "::error::No version found in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pypa/cibuildwheel@v4.3.4
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    needs: check-version
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [check-version, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
