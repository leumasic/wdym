[project]
name = "wdym"
dynamic = ["version"]
description = "A toolkit to parse meaning"
readme = "README.md"
authors = [
    { name = "leumasic", email = "53974949+leumasic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "nanobind>=3.1.0",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "core/**/*" },
    { file = "include/**/*" },
    { file = "bindings/**/*" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.py-api = "cp312"
sdist.exclude = [".dev/", ".github/", ".clang-format"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(wdym VERSION (?P<value>[0-9.]+)'

[tool.cibuildwheel]
# skip free-threaded python
skip = ["cp3??t-*"]
test-command = "python -c \"import wdym; wdym.ByteLevelBPETokenizer()\""
