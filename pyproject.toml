[project]
name = "wdym"
dynamic = ["version"]
description = "A toolkit to parse meaning"
readme = "README.md"
authors = [
    { name = "leumasic", email = "53974949+leumasic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "nanobind==3.1.0",
    "ninja>=1.11",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "core/**/*" },
    { file = "bindings/**/*" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.py-api = "cp312"
# TODO: update min version to stable 4.5.0 version once it lands
cmake.version = ">=4.5.0rc2"
ninja.version = ">=1.11"
sdist.exclude = [".dev/", ".github/", ".clang-format"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(wdym VERSION (?P<value>[0-9.]+)'

[tool.cibuildwheel]
# skip free-threaded python
skip = ["cp3??t-*", "*-musllinux_*"]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
test-command = "python -c \"import wdym; wdym.ByteLevelBPETokenizer.train(sentence_iterator=['hello world'])\""

[tool.cibuildwheel.linux]
before-all = "dnf install -y gcc-toolset-15-gcc-c++"
environment = { CC = "/opt/rh/gcc-toolset-15/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-15/root/usr/bin/g++" }
